<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" role="img">
  <title>How PROJECT works</title>
  <desc>Four steps from left to right: STEP ONE, STEP TWO, STEP THREE, STEP FOUR. This file paints its own background, so it reads the same on a light and on a dark page.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#59636e"/>
    </marker>
  </defs>
  <!-- the card: its own surface and border, so the page colour never shows through the content -->
  <rect x="1" y="1" width="758" height="168" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="22" y="45" width="156" height="80" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
    <text x="100" y="80" font-size="16" font-weight="600" fill="#1f2328">Step one</text>
    <text x="100" y="103" font-size="13" fill="#59636e">what happens</text>

    <rect x="209" y="45" width="156" height="80" rx="10" fill="#2f6feb"/>
    <text x="287" y="80" font-size="16" font-weight="600" fill="#ffffff">Step two</text>
    <text x="287" y="103" font-size="13" fill="#ffffff" fill-opacity="0.85">the one that matters</text>

    <rect x="396" y="45" width="156" height="80" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
    <text x="474" y="80" font-size="16" font-weight="600" fill="#1f2328">Step three</text>
    <text x="474" y="103" font-size="13" fill="#59636e">what happens</text>

    <rect x="583" y="45" width="156" height="80" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
    <text x="661" y="80" font-size="16" font-weight="600" fill="#1f2328">Step four</text>
    <text x="661" y="103" font-size="13" fill="#59636e">what happens</text>
  </g>
  <g stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M182 85H205"/>
    <path d="M369 85H392"/>
    <path d="M556 85H579"/>
  </g>
</svg>
